# iOS 云端打包（在本仓库无 Mac 的情况下产出可测试的 iOS App）
#
# 原理：GitHub Actions 的 macos runner 自带 Xcode，替我们完成
#       `tauri ios init`（生成 Xcode 工程）、前端构建与真机编译。
#
# 两个 job：
#   · simulator（模拟器包）：`tauri ios build --target aarch64-sim`，无需签名，
#     产物 tt-calendar-ios-simulator.zip → Appetize.io 浏览器跑 / Mac Simulator 跑。
#   · device-unsigned（真机未签名包）：`tauri ios init` + 直接 xcodebuild build 关掉
#     签名（CODE_SIGNING_ALLOWED=NO）→ 未签名 .app → 打成 Payload/*.app 的 .ipa，
#     产物 tt-calendar-ios-unsigned-ipa + sideloadly-说明 → Windows 用 Sideloadly 免费自签装机。
#
# 注意（数据依赖）：App 内数据走内网穿透域名（见 apps/mobile/src/main.tsx 的
#   API_BASE 默认值）。跑 App 时你的电脑要开着「启动日历.bat / dev:all」和穿透客户端。
#   穿透域名变了就改 main.tsx 里的默认值，或用仓库 Secrets 里的
#   VITE_API_BASE 覆盖（见下方 build 步骤）。
#
# 免费云 Mac = 把仓库转 public → GitHub Actions macOS runner 完全免费、不限分钟，
#   可反复重新构建；private 仓库每月仅 200 macOS 分钟（10 倍计费率）。

name: iOS build

# pnpm 11 在 build 前会复检依赖(verify-deps-before-run)，进而想清理 node_modules；
# 无 TTY 的 CI 下会中止：ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY（这正是 tauri 的
# "Build Rust Code" phase 调 pnpm 时崩掉的原因）。
# 注意：pnpm 只读 npm_config_*，不认 PNPM_CONFIG_*。
env:
  CI: "true"
  npm_config_confirm_modules_purge: "false"
  npm_config_verify_deps_before_run: "false"
  npm_config_minimum_release_age: "0"

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'scripts/patch-ios-ats.mjs'
      - 'scripts/ios-install-guide.md'
      - '.github/workflows/ios-build.yml'

jobs:
  simulator:
    name: 模拟器包（无需签名）
    # macos-15：默认 Xcode 16，能打开 tauri(2.11) 生成的 Xcode 16 格式工程(objectVersion 77)；
    # macos-14 默认 Xcode 15.4 打不开会报 "future Xcode project file format"
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        # 版本读 package.json 的 packageManager 字段

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust + iOS 编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri

      # pnpm 11 会在 build 前复检依赖并想清理 node_modules，非交互环境直接中止：
      #   ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY
      # tauri 的 iOS「Build Rust Code」phase 内部会调 pnpm，于是整条构建被打断。
      #
      # 两个坑（都是踩过的）：
      #  1) 那个 pnpm 跑在 **Xcode build phase**，不继承这里的 env；且 pnpm 不向上递归找
      #     .npmrc（只读 cwd 和 ~/.npmrc）→ 仓库根的 .npmrc 无效，必须写 ~/.npmrc。
      #  2) 别用 `pnpm config set --global`：pnpm 11 会先检查 global bin 是否在 PATH，
      #     CI 上报 "global bin directory ... is not in PATH" 而失败。直接写文件最可靠。
      - name: 安装依赖（含 pnpm 无头全局配置）
        run: |
          printf 'confirm-modules-purge=false\nverify-deps-before-run=false\n' >> "$HOME/.npmrc"
          cat "$HOME/.npmrc"
          pnpm install --frozen-lockfile

      - name: 生成 Xcode 工程
        working-directory: apps/mobile
        run: pnpm tauri ios init --ci

      - name: 放行 http 数据服务（ATS）
        run: node scripts/patch-ios-ats.mjs

      - name: 构建模拟器版 App
        working-directory: apps/mobile
        env:
          # 可选：在仓库 Settings → Secrets 里配 VITE_API_BASE 即可不改代码换数据地址
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: pnpm tauri ios build --target aarch64-sim --ci

      - name: 压缩 .app 产物
        run: |
          APP=$(find apps/mobile/src-tauri/gen/apple/build -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo '未找到 .app 产物，列出 build 目录以便排障：'
            find apps/mobile/src-tauri/gen/apple/build -maxdepth 4 || true
            exit 1
          fi
          echo "打包: $APP"
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/tt-calendar-ios-sim.zip" "$(basename "$APP")")

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tt-calendar-ios-simulator
          path: tt-calendar-ios-sim.zip
          retention-days: 14

  # 真机 .ipa（未签名）：下载后用 Sideloadly 免费签你自己的 Apple ID 装到 iPhone。
  # 原理：tauri 的 --no-sign 只对桌面生效、对 iOS 无效，故先 sed 关掉 Xcode 签名，
  #       再用 tauri ios build 构建真机 .app（export 阶段因无签名会以 70 退出，属预期），
  #       最后手动打成标准 Payload/*.app 的 .ipa。Sideloadly/AltStore 都能吃这种包再自签。
  device-unsigned:
    name: 真机包（未签名，Sideloadly 自签）
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust + iOS 真机编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri

      # pnpm 11 会在 build 前复检依赖并想清理 node_modules，非交互环境直接中止：
      #   ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY
      # tauri 的 iOS「Build Rust Code」phase 内部会调 pnpm，于是整条构建被打断。
      #
      # 两个坑（都是踩过的）：
      #  1) 那个 pnpm 跑在 **Xcode build phase**，不继承这里的 env；且 pnpm 不向上递归找
      #     .npmrc（只读 cwd 和 ~/.npmrc）→ 仓库根的 .npmrc 无效，必须写 ~/.npmrc。
      #  2) 别用 `pnpm config set --global`：pnpm 11 会先检查 global bin 是否在 PATH，
      #     CI 上报 "global bin directory ... is not in PATH" 而失败。直接写文件最可靠。
      - name: 安装依赖（含 pnpm 无头全局配置）
        run: |
          printf 'confirm-modules-purge=false\nverify-deps-before-run=false\n' >> "$HOME/.npmrc"
          cat "$HOME/.npmrc"
          pnpm install --frozen-lockfile

      - name: 生成 Xcode 工程
        working-directory: apps/mobile
        run: pnpm tauri ios init --ci

      - name: 放行 http 数据服务（ATS）
        run: node scripts/patch-ios-ats.mjs

      # 真机 .ipa（未签名）：CI 没有 Apple 开发者账号，无法走正式签名。
      # 做法：用 `tauri ios init` 生成 Xcode 工程 → 直接用 xcodebuild build，
      #       并传 CODE_SIGNING_ALLOWED=NO 关掉签名 → 产出「未签名 .app」，
      #       再手动打成 Payload/*.app 的 .ipa，Sideloadly/AltStore 在本机自签装机。
      # 关键点：全程 set -u 友好——所有变量先赋值再引用，杜绝 unbound variable。
      - name: 构建前端
        working-directory: apps/mobile
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: pnpm build

      - name: 构建未签名真机 .app
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # 1) 定位生成的 Xcode workspace（产品名「TT 日历」含空格，不能写死）
          WS=$(find src-tauri/gen/apple -maxdepth 1 -name '*.xcworkspace' | head -1)
          if [ -z "$WS" ]; then
            echo "找不到 .xcworkspace，列出 gen/apple 以便排障："
            find src-tauri/gen/apple -maxdepth 2 || true
            exit 1
          fi
          echo "workspace: $WS"
          # 2) 取 iOS scheme（形如 «产品名»_iOS），去掉首尾空白
          SCHEME=$(xcodebuild -workspace "$WS" -list 2>/dev/null \
            | awk '/^Schemes:/{f=1;next} f&&/iOS/{print;exit}' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$SCHEME" ]; then
            echo "找不到 iOS scheme，列出全部 scheme："
            xcodebuild -workspace "$WS" -list || true
            exit 1
          fi
          echo "scheme: $SCHEME"
          # 3) 直接 build，关掉签名（命令行 build setting 覆盖工程设置）
          DD="$GITHUB_WORKSPACE/ios-dd"
          rm -rf "$DD"
          set +e
          xcodebuild build \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            > /tmp/xcb.log 2>&1
          XB=$?
          echo "xcodebuild 退出码: $XB"
          echo "--- 日志尾部 ---"
          tail -50 /tmp/xcb.log
          if [ "$XB" != "0" ]; then
            echo "xcodebuild 失败"
            exit 1
          fi
          set -e
          # 4) 取产物 .app 并校验非空
          APP=$(find "$DD" -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 .app 产物，列出 DerivedData："
            find "$DD" -maxdepth 6 -name '*.app' 2>/dev/null || true
            exit 1
          fi
          EXE=$(find "$APP" -maxdepth 1 -type f -perm -111 | head -1)
          if [ -z "$EXE" ]; then
            echo ".app 内无可执行文件，产物无效: $APP"
            exit 1
          fi
          echo "真机 .app 产物: $APP"
          echo "可执行: $EXE ($(du -h "$EXE" | cut -f1))"
          printf '%s' "$APP" > "$GITHUB_WORKSPACE/app_path.txt"

      - name: 打包为未签名 .ipa（Payload 结构）
        run: |
          set -euo pipefail
          APP=$(cat "$GITHUB_WORKSPACE/app_path.txt")
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "无有效 .app 路径: $APP"
            exit 1
          fi
          # 校验 .app 里确有可执行文件，防止误打空壳
          EXE=$(find "$APP" -maxdepth 1 -type f -perm -111 | head -1)
          if [ -z "$EXE" ]; then echo ".app 内无可执行文件，产物无效: $APP"; exit 1; fi
          echo "可执行: $EXE ($(du -h "$EXE" | cut -f1))"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -type f -exec chmod 644 {} +
          find Payload -type d -exec chmod 755 {} +
          zip -qry "$GITHUB_WORKSPACE/tt-calendar-ios-unsigned.ipa" Payload/
          rm -rf Payload
          ls -lh "$GITHUB_WORKSPACE/tt-calendar-ios-unsigned.ipa"

      - name: 上传真机包
        uses: actions/upload-artifact@v4
        with:
          name: tt-calendar-ios-unsigned-ipa
          path: tt-calendar-ios-unsigned.ipa
          retention-days: 14

      - name: 附安装说明
        uses: actions/upload-artifact@v4
        with:
          name: sideloadly-说明
          path: scripts/ios-install-guide.md
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# 真机安装现状
# ─ 免费路线（已启用，见上方 device-unsigned job）：Cloud 直接 xcodebuild 关签名，
#   产出「未签名 .ipa」；Windows 用 Sideloadly 免费签你的 Apple ID、USB 装机。
#   7 天有效，到期重装续（重新跑本 workflow 即可，无需 Mac）。
# ─ $99 付费路线（要上架 App Store 或给朋友大批量分发时再加正式 job）：
#   developer.apple.com 建证书+描述文件 → 存仓库 Secrets → CI 直接签名出能走
#   TestFlight 的 .ipa（1 年有效，Beta 最多 100 台设备）。届时新写一个
#   device-signed job（去掉 CODE_SIGNING_ALLOWED=NO，改用签名导出）。
# ─────────────────────────────────────────────────────────────────────────────
