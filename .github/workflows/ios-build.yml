# iOS 云端打包（在本仓库无 Mac 的情况下产出可测试的 iOS App）
#
# 原理：GitHub Actions 的 macos runner 自带 Xcode，替我们完成
#       `tauri ios init`（生成 Xcode 工程）和模拟器构建。
#
# 产物：iOS 模拟器版 .app（zip 压缩）。两种用法：
#   1. Appetize.io（推荐，浏览器直接跑）：把 zip 上传到 https://appetize.io ，
#      在任意 Windows 浏览器里就能操作这个 iOS App。
#   2. 有 Mac 时：unzip 后拖进 Xcode 的 Simulator 直接运行。
#
# 注意（数据依赖）：App 内数据走内网穿透域名（见 apps/mobile/src/main.tsx 的
#   API_BASE 默认值）。跑 App 时你的电脑要开着「启动日历.bat / dev:all」和穿透客户端。
#   穿透域名变了就改 main.tsx 里的默认值，或用仓库 Secrets 里的
#   VITE_API_BASE 覆盖（见下方 build 步骤）。
#
# 真机 .ipa（装到自己 iPhone）需要 Apple 签名，见文件末尾注释。

name: iOS build

# pnpm 11 在 build 前会复检依赖(verify-deps-before-run)，进而想清理 node_modules；
# 无 TTY 的 CI 下会中止：ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY（这正是 tauri 的
# "Build Rust Code" phase 调 pnpm 时崩掉的原因）。
# 注意：pnpm 只读 npm_config_*，不认 PNPM_CONFIG_*。
env:
  CI: "true"
  npm_config_confirm_modules_purge: "false"
  npm_config_verify_deps_before_run: "false"
  npm_config_minimum_release_age: "0"

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'scripts/patch-ios-ats.mjs'
      - 'scripts/ios-install-guide.md'
      - '.github/workflows/ios-build.yml'

jobs:
  simulator:
    name: 模拟器包（无需签名）
    # macos-15：默认 Xcode 16，能打开 tauri(2.11) 生成的 Xcode 16 格式工程(objectVersion 77)；
    # macos-14 默认 Xcode 15.4 打不开会报 "future Xcode project file format"
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        # 版本读 package.json 的 packageManager 字段

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust + iOS 编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Xcode 工程
        working-directory: apps/mobile
        run: pnpm tauri ios init --ci

      - name: 放行 http 数据服务（ATS）
        run: node scripts/patch-ios-ats.mjs

      - name: 构建模拟器版 App
        working-directory: apps/mobile
        env:
          # 可选：在仓库 Settings → Secrets 里配 VITE_API_BASE 即可不改代码换数据地址
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: pnpm tauri ios build --target aarch64-sim --ci

      - name: 压缩 .app 产物
        run: |
          APP=$(find apps/mobile/src-tauri/gen/apple/build -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo '未找到 .app 产物，列出 build 目录以便排障：'
            find apps/mobile/src-tauri/gen/apple/build -maxdepth 4 || true
            exit 1
          fi
          echo "打包: $APP"
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/tt-calendar-ios-sim.zip" "$(basename "$APP")")

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tt-calendar-ios-simulator
          path: tt-calendar-ios-sim.zip
          retention-days: 14

  # 真机 .ipa（未签名）：下载后用 Sideloadly 免费签你自己的 Apple ID 装到 iPhone。
  # 原理：tauri 的 --no-sign 只对桌面生效、对 iOS 无效，故先 sed 关掉 Xcode 签名，
  #       再用 tauri ios build 构建真机 .app（export 阶段因无签名会以 70 退出，属预期），
  #       最后手动打成标准 Payload/*.app 的 .ipa。Sideloadly/AltStore 都能吃这种包再自签。
  device-unsigned:
    name: 真机包（未签名，Sideloadly 自签）
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust + iOS 真机编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Xcode 工程
        working-directory: apps/mobile
        run: pnpm tauri ios init --ci

      - name: 放行 http 数据服务（ATS）
        run: node scripts/patch-ios-ats.mjs

      # 注意：真机 .ipa 需要代码签名证书，CI(无开发者账号) 无法干净产出；
      # 本步尝试官方 tauri ios build 出包，失败即诚实报错（不再误打空壳）。
      # 可靠的未签名真机包请用 docs/ios-build-guide.md 里的「Mac 本机一键脚本」。
      - name: 构建真机 .app（官方 tauri ios build，CI 下通常因无签名失败）
        working-directory: apps/mobile
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          set -euo pipefail
          set +e
          pnpm tauri ios build --target aarch64 > /tmp/ios_build.log 2>&1
          code=$?
          echo "tauri ios build 退出码: $code"
          echo "--- 日志尾部 ---"
          tail -40 /tmp/ios_build.log
          # 有 .app 且非空才算成功；否则失败（不产出空包）
          APP=$(find src-tauri/gen/apple/build -name '*.app' -type d | head -1)
          if [ "$code" = "0" ] && [ -n "$APP" ] && [ -n "$(find "$APP" -maxdepth 1 -type f -perm -111 | head -1)" ]; then
            echo "真机 .app 产物: $APP"
            exit 0
          fi
          echo "真机构建未产出有效 .app（退出码 $code）。"
          echo "CI 无签名证书，真机出包请改用 docs/ios-build-guide.md 的 Mac 本机脚本。"
          exit 1

      - name: 打包为未签名 .ipa（Payload 结构）
        run: |
          set -e
          APP=$(find apps/mobile/src-tauri/gen/apple/build -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then echo '无 .app'; exit 1; fi
          # 校验 .app 里确有可执行文件，防止误打空壳
          EXE=$(find "$APP" -maxdepth 1 -type f -perm -111 | head -1)
          if [ -z "$EXE" ]; then echo ".app 内无可执行文件，产物无效: $APP"; exit 1; fi
          echo "可执行: $EXE ($(du -h "$EXE" | cut -f1))"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -type f -exec chmod 644 {} +
          find Payload -type d -exec chmod 755 {} +
          zip -qry "$GITHUB_WORKSPACE/tt-calendar-ios-unsigned.ipa" Payload/
          rm -rf Payload
          ls -lh "$GITHUB_WORKSPACE/tt-calendar-ios-unsigned.ipa"

      - name: 上传真机包
        uses: actions/upload-artifact@v4
        with:
          name: tt-calendar-ios-unsigned-ipa
          path: tt-calendar-ios-unsigned.ipa
          retention-days: 14

      - name: 附安装说明
        uses: actions/upload-artifact@v4
        with:
          name: sideloadly-说明
          path: scripts/ios-install-guide.md
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# 真机安装现状
# ─ 免费路线（已启用，见上方 device-unsigned job）：Cloud 出「未签名 .ipa」，
#   Windows 用 Sideloadly 免费签你的 Apple ID、USB 装机。7 天有效，重装续。
# ─ $99 付费路线（要上架 App Store 或给朋友大批量分发时再加正式 job）：
#   developer.apple.com 建证书+描述文件 → 存仓库 Secrets → CI 直接签名出能走
#   TestFlight 的 .ipa（1 年有效，Beta 最多 100 台设备）。届时新写一个
#   device-signed job（不 sed 关签名、改用签名导出）。
# ─────────────────────────────────────────────────────────────────────────────
