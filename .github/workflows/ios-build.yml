# iOS 云端打包（在本仓库无 Mac 的情况下产出可测试的 iOS App）
#
# 原理：GitHub Actions 的 macos-15 runner 自带 Xcode 16，替我们完成
#       `tauri ios init`（生成 Xcode 工程）、前端构建与真机编译。
#
# 两个 job（都用「直接 xcodebuild」而非 `tauri ios build`，原因见文件末尾注释）：
#   · simulator（模拟器包）：iphonesimulator sdk，无需签名，产物 .zip
#     → Appetize.io 浏览器跑 / Mac Simulator 跑。
#   · device-unsigned（真机包）：iphoneos sdk + ad-hoc 签名（CODE_SIGN_IDENTITY=-）
#     带 App Group entitlements 的 WidgetKit extension 需要签名才能真正嵌入，
#     故真机 job 改用 ad-hoc 自签；侧载工具（Sideloadly/iLoader）重签时保留
#     entitlements，主屏小组件才能读到 App Group 共享数据
#     → 未签名 .app → 打成 Payload/*.app 的 .ipa，iLoader/SideStore/Sideloadly
#     免费自签装机。
#
# ⚠️ 生产模式保障（2026-09 白屏事故）：xcode-script 编译 Rust lib 时必须带
#   `tauri/custom-protocol` feature，否则 tauri 置 cfg(dev)，App 运行时把资源
#   请求代理到 devUrl（http://localhost:5175），真机上白屏报 local network 错。
#   现由双保险兜底 + 构建后验证守门：
#     1) apps/mobile/src-tauri/Cargo.toml [features] default 含 custom-protocol；
#     2) scripts/ci-ios-options-server 返回该 feature（等价官方 build_options()）；
#     3) scripts/verify-ios-build.mjs 在打包前验证产物（dev 标记/资源内嵌/plist）。
#
# 数据依赖：App 内数据默认手机本地库（sql.js + IndexedDB），离线可用；
#   若仓库配了 Secrets 的 VITE_API_BASE 则改为 HTTP 连电脑数据服务（见 build 步骤）。
#
# 免费云 Mac = 仓库转 public → GitHub Actions macOS runner 完全免费、不限分钟；
#   private 仓库每月仅 200 macOS 分钟（10 倍计费率）。

name: iOS build

env:
  CI: "true"

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'scripts/patch-ios-plist.mjs'
      - 'scripts/patch-add-widget.mjs'
      - 'scripts/patch-ios-icons.mjs'
      - 'scripts/verify-ios-build.mjs'
      - 'scripts/ios-install-guide.md'
      - 'scripts/ci-ios-options-server/**'
      - '.github/workflows/ios-build.yml'

jobs:
  simulator:
    name: 模拟器包（无需签名）
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        # 版本读 package.json 的 packageManager 字段

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust + iOS 编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri

      # pnpm 11 在非交互终端想清理 node_modules 会中止：ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY。
      # 写进 ~/.npmrc 兜底；更关键的是 xcodebuild 的 build setting 会把 CI=true 注入
      # "Build Rust Code" phase（见下方 xcodebuild 命令），phase 里的 pnpm 看到 CI=true 即跳过确认。
      - name: 安装依赖（含 pnpm 无头全局配置）
        run: |
          printf 'confirm-modules-purge=false\nverify-deps-before-run=false\n' >> "$HOME/.npmrc"
          pnpm install --frozen-lockfile

      - name: 构建前端
        working-directory: apps/mobile
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: pnpm build

      - name: 生成 Xcode 工程
        working-directory: apps/mobile
        run: pnpm tauri ios init --ci

      - name: 注入 Info.plist 权限键（ATS + 本地网络）
        run: node scripts/patch-ios-plist.mjs

      - name: 注入主屏小组件 target（WidgetKit）
        run: node scripts/patch-add-widget.mjs

      - name: 收敛为 iPhone 专用（iPad 支持未经真机验证，且会强制要 iPad 截图）
        run: node scripts/patch-ios-device-family.mjs

      # tauri ios init 生成工程时放的是 tauri 内置默认图标；官方 tauri ios build
      # 的图标同步被「直接 xcodebuild」路线跳过了，这里手动补上（20260918 任务书 1.4）
      - name: 覆盖应用图标（tauri icon 产物 → AppIcon.appiconset）
        run: node scripts/patch-ios-icons.mjs

      - name: 构建模拟器版 App（直接 xcodebuild）
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # ── 1) 启动伪造的 tauri options WebSocket 服务 ──────────────────────
          # tauri ios xcode-script 在「Build Rust Code」phase 会无条件读
          # $TMPDIR/com.<identifier>-server-addr 并连上去用 JSON-RPC 取 CliOptions；
          # CI 里没有真实 dev server 会 panic。这里起一个「同版本 jsonrpsee」假服务
          # （只实现 `options` 方法，返回最小 CliOptions），让 xcode-script 正常走完
          # 原生编译（头文件/lib 路径都由它自己正确生成）。源码 scripts/ci-ios-options-server，
          # 原理见文件末尾说明。
          pushd "$GITHUB_WORKSPACE/scripts/ci-ios-options-server" >/dev/null
          cargo build --release 2>&1 | tail -8
          SRV="$GITHUB_WORKSPACE/scripts/ci-ios-options-server/target/release/ci-ios-options-server"
          popd >/dev/null
          "$SRV" &
          SRV_PID=$!
          trap 'kill $SRV_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            [ -f "${TMPDIR:-/tmp}/com.tt.calendar.mobile-server-addr" ] && break
            sleep 0.5
          done
          if [ ! -f "${TMPDIR:-/tmp}/com.tt.calendar.mobile-server-addr" ]; then
            echo "options server 未就绪（没写 addr 文件）"; exit 1
          fi
          echo "options server 地址: $(cat "${TMPDIR:-/tmp}/com.tt.calendar.mobile-server-addr")"

          # ── 2) 找工程 / scheme（tauri ios init 生成的是 .xcodeproj，嵌套的
          #       project.xcworkspace 在内部，不能用 *.xcworkspace）──────────────
          PROJ=$(find src-tauri/gen/apple -maxdepth 1 -name '*.xcodeproj' | head -1)
          if [ -z "$PROJ" ]; then
            echo "找不到 .xcodeproj，列出 gen/apple 排障："
            find src-tauri/gen/apple -maxdepth 2 || true
            exit 1
          fi
          echo "project: $PROJ"
          # 取 iOS scheme（形如 tt-calendar-mobile_iOS），去掉首尾空白
          # set -e + pipefail 下 xcodebuild -list 失败会直接终止脚本、吞掉错误信息；
          # 这里显式接住并打印原始输出（如 pbxproj 被注入脚本改坏时能立刻看到）
          set +e
          LIST_OUT=$(xcodebuild -project "$PROJ" -list 2>&1)
          LIST_RC=$?
          set -e
          printf '%s\n' "$LIST_OUT" | head -40
          if [ "$LIST_RC" != "0" ]; then
            echo "xcodebuild -list 失败（退出码 $LIST_RC）：工程文件可能有问题"
            exit 1
          fi
          SCHEME=$(printf '%s\n' "$LIST_OUT" | awk '/Schemes:/{f=1;next} f&&/iOS/{print;exit}' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$SCHEME" ]; then
            echo "找不到 iOS scheme（见上方 list 输出）"
            exit 1
          fi
          echo "scheme: $SCHEME"
          DD="$GITHUB_WORKSPACE/ios-dd"
          rm -rf "$DD"
          set +e
          xcodebuild build \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DD" \
            CI=true \
            npm_config_confirm_modules_purge=false \
            npm_config_verify_deps_before_run=false \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            > /tmp/xcb.log 2>&1
          XB=$?
          echo "xcodebuild 退出码: $XB"
          echo "--- 日志尾部（120 行）---"
          tail -120 /tmp/xcb.log
          echo "--- 与小组件相关的构建行 ---"
          grep -nE "TTWidget|appex|Embed Foundation|CopyFiles" /tmp/xcb.log | head -40 || true
          echo "--- Build/Products 下的产物树 ---"
          find "$DD/Build/Products" -maxdepth 2 \( -name '*.app' -o -name '*.appex' \) 2>/dev/null | sed 's/^/  /' || true
          if [ "$XB" != "0" ]; then
            echo "xcodebuild 失败"
            exit 1
          fi
          set -e
          APP=$(find "$DD" -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 .app 产物，列出 DerivedData："
            find "$DD" -maxdepth 6 -name '*.app' 2>/dev/null || true
            exit 1
          fi
          EXE=$(find "$APP" -maxdepth 1 -type f -perm -111 | head -1)
          if [ -z "$EXE" ]; then
            echo ".app 内无可执行文件，产物无效: $APP"
            exit 1
          fi
          echo "模拟器 .app 产物: $APP ($(du -h "$EXE" | cut -f1))"
          printf '%s' "$APP" > "$GITHUB_WORKSPACE/app_path.txt"

      - name: 验证生产模式产物
        run: node scripts/verify-ios-build.mjs "$(cat app_path.txt)" apps/mobile/dist

      - name: 压缩 .app 产物
        run: |
          set -euo pipefail
          APP=$(cat "$GITHUB_WORKSPACE/app_path.txt")
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "无有效 .app 路径: $APP"
            exit 1
          fi
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/tt-calendar-ios-sim.zip" "$(basename "$APP")")
          ls -lh "$GITHUB_WORKSPACE/tt-calendar-ios-sim.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tt-calendar-ios-simulator
          path: tt-calendar-ios-sim.zip
          retention-days: 14

  # 真机 .ipa（未签名）：下载后用 iLoader/SideStore/Sideloadly 免费签自己的 Apple ID 装到 iPhone。
  # 做法：tauri ios init 生成工程 → 直接 xcodebuild build 关掉签名
  #       （CODE_SIGNING_ALLOWED=NO）→ 产出「未签名 .app」→ 手动打成
  #       Payload/*.app 的 .ipa。iLoader/SideStore/Sideloadly 在本机自签装机（7 天有效）。
  device-unsigned:
    name: 真机包（未签名，iLoader/SideStore/Sideloadly 自签）
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust + iOS 真机编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri

      - name: 安装依赖（含 pnpm 无头全局配置）
        run: |
          printf 'confirm-modules-purge=false\nverify-deps-before-run=false\n' >> "$HOME/.npmrc"
          pnpm install --frozen-lockfile

      - name: 构建前端
        working-directory: apps/mobile
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: pnpm build

      - name: 生成 Xcode 工程
        working-directory: apps/mobile
        run: pnpm tauri ios init --ci

      - name: 注入 Info.plist 权限键（ATS + 本地网络）
        run: node scripts/patch-ios-plist.mjs

      - name: 注入主屏小组件 target（WidgetKit）
        run: node scripts/patch-add-widget.mjs

      - name: 收敛为 iPhone 专用（iPad 支持未经真机验证，且会强制要 iPad 截图）
        run: node scripts/patch-ios-device-family.mjs

      # 同模拟器 job：init 生成的默认图标 → 仓库里的正式图标（20260918 任务书 1.4）
      - name: 覆盖应用图标（tauri icon 产物 → AppIcon.appiconset）
        run: node scripts/patch-ios-icons.mjs

      - name: 上传生成的 Xcode 工程（小组件注入脚本的分析输入）
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project-dump
          path: apps/mobile/src-tauri/gen/apple
          retention-days: 7

      - name: 构建未签名真机 .app（直接 xcodebuild 关签名）
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # ── 1) 启动伪造的 tauri options WebSocket 服务 ──────────────────────
          # 同模拟器 job：起同版本 jsonrpsee 假服务冒充 dev server 的 options RPC，
          # 让 tauri ios xcode-script 跳过 WebSocket 依赖、正常编译 Rust。
          pushd "$GITHUB_WORKSPACE/scripts/ci-ios-options-server" >/dev/null
          cargo build --release 2>&1 | tail -8
          SRV="$GITHUB_WORKSPACE/scripts/ci-ios-options-server/target/release/ci-ios-options-server"
          popd >/dev/null
          "$SRV" &
          SRV_PID=$!
          trap 'kill $SRV_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            [ -f "${TMPDIR:-/tmp}/com.tt.calendar.mobile-server-addr" ] && break
            sleep 0.5
          done
          if [ ! -f "${TMPDIR:-/tmp}/com.tt.calendar.mobile-server-addr" ]; then
            echo "options server 未就绪（没写 addr 文件）"; exit 1
          fi
          echo "options server 地址: $(cat "${TMPDIR:-/tmp}/com.tt.calendar.mobile-server-addr")"

          # ── 2) 找工程 / scheme（tauri ios init 生成的是 .xcodeproj）──────────
          PROJ=$(find src-tauri/gen/apple -maxdepth 1 -name '*.xcodeproj' | head -1)
          if [ -z "$PROJ" ]; then
            echo "找不到 .xcodeproj，列出 gen/apple 排障："
            find src-tauri/gen/apple -maxdepth 2 || true
            exit 1
          fi
          echo "project: $PROJ"
          # set -e + pipefail 下 xcodebuild -list 失败会直接终止脚本、吞掉错误信息；
          # 这里显式接住并打印原始输出（如 pbxproj 被注入脚本改坏时能立刻看到）
          set +e
          LIST_OUT=$(xcodebuild -project "$PROJ" -list 2>&1)
          LIST_RC=$?
          set -e
          printf '%s\n' "$LIST_OUT" | head -40
          if [ "$LIST_RC" != "0" ]; then
            echo "xcodebuild -list 失败（退出码 $LIST_RC）：工程文件可能有问题"
            exit 1
          fi
          SCHEME=$(printf '%s\n' "$LIST_OUT" | awk '/Schemes:/{f=1;next} f&&/iOS/{print;exit}' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$SCHEME" ]; then
            echo "找不到 iOS scheme（见上方 list 输出）"
            exit 1
          fi
          echo "scheme: $SCHEME"
          DD="$GITHUB_WORKSPACE/ios-dd"
          rm -rf "$DD"
          set +e
          xcodebuild build \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DD" \
            CI=true \
            npm_config_confirm_modules_purge=false \
            npm_config_verify_deps_before_run=false \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            > /tmp/xcb.log 2>&1
          XB=$?
          echo "xcodebuild 退出码: $XB"
          echo "--- 日志尾部（120 行）---"
          tail -120 /tmp/xcb.log
          echo "--- 与小组件相关的构建行 ---"
          grep -nE "TTWidget|appex|Embed Foundation|CopyFiles" /tmp/xcb.log | head -40 || true
          echo "--- Build/Products 下的产物树 ---"
          find "$DD/Build/Products" -maxdepth 2 \( -name '*.app' -o -name '*.appex' \) 2>/dev/null | sed 's/^/  /' || true
          if [ "$XB" != "0" ]; then
            echo "xcodebuild 失败"
            exit 1
          fi
          set -e
          APP=$(find "$DD" -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 .app 产物，列出 DerivedData："
            find "$DD" -maxdepth 6 -name '*.app' 2>/dev/null || true
            exit 1
          fi
          EXE=$(find "$APP" -maxdepth 1 -type f -perm -111 | head -1)
          if [ -z "$EXE" ]; then
            echo ".app 内无可执行文件，产物无效: $APP"
            exit 1
          fi
          echo "真机 .app 产物: $APP ($(du -h "$EXE" | cut -f1))"
          printf '%s' "$APP" > "$GITHUB_WORKSPACE/app_path.txt"

      - name: 验证生产模式产物
        run: node scripts/verify-ios-build.mjs "$(cat app_path.txt)" apps/mobile/dist

      - name: 打包为未签名 .ipa（Payload 结构）
        run: |
          set -euo pipefail
          APP=$(cat "$GITHUB_WORKSPACE/app_path.txt")
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "无有效 .app 路径: $APP"
            exit 1
          fi
          EXE=$(find "$APP" -maxdepth 1 -type f -perm -111 | head -1)
          if [ -z "$EXE" ]; then echo ".app 内无可执行文件，产物无效: $APP"; exit 1; fi
          echo "可执行: $EXE ($(du -h "$EXE" | cut -f1))"
          # 主屏小组件必须真的嵌进 PlugIns/，否则装上也没有小组件可选。
          # 这里是**硬失败**：此前只打警告，构建仍然绿并上传了没有小组件的
          # ipa（2026-09-15 悬空引用事故就是这个静默通道放过去的）。
          if [ ! -d "$APP/PlugIns/TTWidget.appex" ]; then
            echo "错误：PlugIns/TTWidget.appex 缺失——小组件未嵌入，产物不可用"
            echo "--- .app 内容 ---"
            ls -la "$APP" | sed 's/^/  /'
            exit 1
          fi
          echo "已嵌入 extension："
          find "$APP/PlugIns" -maxdepth 2 | sed 's/^/  /'
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -type f -exec chmod 644 {} +
          find Payload -type d -exec chmod 755 {} +
          # 主可执行必须保留 x 位（上面的 blanket 644 会抹掉；签名/安装工具虽常
          # 不看 zip 内权限位，但别赌运气）
          chmod 755 "Payload/$(basename "$APP")/$(basename "$EXE")"
          zip -qry "$GITHUB_WORKSPACE/tt-calendar-ios-unsigned.ipa" Payload/
          rm -rf Payload
          ls -lh "$GITHUB_WORKSPACE/tt-calendar-ios-unsigned.ipa"

      - name: 上传真机包
        uses: actions/upload-artifact@v4
        with:
          name: tt-calendar-ios-unsigned-ipa
          path: tt-calendar-ios-unsigned.ipa
          retention-days: 14

      - name: 附安装说明
        uses: actions/upload-artifact@v4
        with:
          name: ios-install-guide
          path: scripts/ios-install-guide.md
          retention-days: 14

  # ── 签名发布：API Key 自动签名 → TestFlight ─────────────────────────────────
  # 前置（一次性，全部就位前本 job 会在校验步直接失败并提示）：
  #   1. 开发者后台 developer.apple.com → Identifiers → App Groups 注册
  #      group.com.tt.calendar.mobile（App Group 创建不在公开 API 内，只能网页注册）
  #   2. 仓库 Settings → Secrets and variables → Actions 添加三个 Secret：
  #      APPSTORE_KEY_ID（如 PT4T88KGY3）/ APPSTORE_ISSUER_ID / APPSTORE_P8（.p8 全文）
  #   3. App Store Connect 网页 → Apps → 新建 App（bundle com.tt.calendar.mobile，
  #      主语言 简体中文，SKU tt-calendar-2026）
  # 签名走**手动签名**：自建 Apple Distribution 证书 + 两份 App Store 描述文件
  # （由 ASC API 创建，证书私钥与描述文件内容存 Secrets，见 docs/APPSTORE-SUBMISSION.md）。
  # 不用云签（automatic + -allowProvisioningUpdates）的原因：云签在全新 CI 机器上找不到
  # 可复用的开发证书就会**新建**一张，账户证书配额很快被吃满，之后构建全部失败
  # （20260921 实录：reached the maximum number of certificates）。
  # build 号由 scripts/patch-ios-version.mjs 注入为 run 编号。
  appstore:
    name: 签名发布（TestFlight）
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # iOS 26 SDK 起 Apple 不再接受更低版本构建（上传校验直接拒收）→ appstore job 用 macos-26
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Secrets 是否就位
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_P8 }}
          P12: ${{ secrets.APPSTORE_P12 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_P12_PASSWORD }}
          PROFILE_MAIN: ${{ secrets.APPSTORE_PROFILE_MAIN }}
          PROFILE_WIDGET: ${{ secrets.APPSTORE_PROFILE_WIDGET }}
        run: |
          missing=0
          for v in KEY_ID ISSUER_ID P8 P12 P12_PASSWORD PROFILE_MAIN PROFILE_WIDGET; do
            if [ -z "${!v}" ]; then echo "缺少 Secret: $v（见 job 注释的前置条件）"; missing=1; fi
          done
          exit $missing

      - name: 打印工具链版本（排查 SDK 版本门槛用）
        run: |
          xcodebuild -version
          xcode-select -p
          ls /Applications | grep -i "^Xcode" || true

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust + iOS 真机编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri

      - name: 安装依赖（含 pnpm 无头全局配置）
        run: |
          printf 'confirm-modules-purge=false\nverify-deps-before-run=false\n' >> "$HOME/.npmrc"
          pnpm install --frozen-lockfile

      - name: 构建前端
        working-directory: apps/mobile
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: pnpm build

      - name: 生成 Xcode 工程
        working-directory: apps/mobile
        run: pnpm tauri ios init --ci

      - name: 注入 Info.plist 权限键（ATS + 本地网络 + 出口合规）
        run: node scripts/patch-ios-plist.mjs

      - name: 注入主屏小组件 target（WidgetKit）
        run: node scripts/patch-add-widget.mjs

      - name: 收敛为 iPhone 专用（iPad 支持未经真机验证，且会强制要 iPad 截图）
        run: node scripts/patch-ios-device-family.mjs

      - name: 改为手动签名（自建发布证书 + 描述文件，避开云签证书配额）
        run: node scripts/patch-ios-signing.mjs

      - name: 覆盖应用图标
        run: node scripts/patch-ios-icons.mjs

      # build 号 = run 编号（ASC 要求同版本的 build 号唯一；tauri 每次生成的工程都是固定值）
      - name: 注入唯一 build 号
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/patch-ios-version.mjs

      - name: 写入 App Store Connect API 私钥
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          mkdir -p private_keys "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$P8" > "private_keys/AuthKey_${KEY_ID}.p8"
          cp "private_keys/AuthKey_${KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"

      - name: 写入签名材料（证书 + 两个描述文件）
        env:
          P12_B64: ${{ secrets.APPSTORE_P12 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_P12_PASSWORD }}
          MAIN_B64: ${{ secrets.APPSTORE_PROFILE_MAIN }}
          WIDGET_B64: ${{ secrets.APPSTORE_PROFILE_WIDGET }}
        run: |
          set -euo pipefail
          mkdir -p signing
          printf '%s' "$P12_B64" | base64 -d > signing/cert.p12
          printf '%s' "$MAIN_B64" | base64 -d > signing/tt-main.mobileprovision
          printf '%s' "$WIDGET_B64" | base64 -d > signing/tt-widget.mobileprovision
          ls -la signing/
          # 描述文件校验：macOS 原生 security cms 解析（mobileprovision 是二进制 CMS）。
          # p12 不做 openssl 自检——macOS 自带的是 LibreSSL，读不了 RC2 传统加密格式，
          # 由下一步 security import 做真校验即可。
          for f in signing/*.mobileprovision; do
            security cms -D -i "$f" > /dev/null || { echo "描述文件无效: $f"; exit 1; }
          done
          echo "签名材料校验通过（p12 交由 security import 校验）"

      - name: 安装签名身份与描述文件
        # 分发证书（ASC API 创建，本地私钥打包 p12）与两个 App Store 描述文件
        # （主 App + 小组件，均含 App Group group.com.tt.calendar.mobile）走 Secrets。
        # 走手动签名的原因：云签（automatic + allowProvisioningUpdates）在导出环节
        # 报 "Cloud signing permission error"（API Key 无创建发布描述文件的权限）。
        env:
          P12_PASSWORD: ${{ secrets.APPSTORE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KC_PASS" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import signing/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" build.keychain
          echo "--- 可用签名身份 ---"
          security find-identity -v -p codesigning build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp signing/*.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          echo "--- 已安装描述文件 ---"
          ls "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: 归档 .xcarchive（自动签名，dev 描述文件由云签创建）
        working-directory: apps/mobile
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          # ── 伪造 tauri options WebSocket 服务（同 device-unsigned，见文件尾注）──
          pushd "$GITHUB_WORKSPACE/scripts/ci-ios-options-server" >/dev/null
          cargo build --release 2>&1 | tail -4
          SRV="$GITHUB_WORKSPACE/scripts/ci-ios-options-server/target/release/ci-ios-options-server"
          popd >/dev/null
          "$SRV" &
          SRV_PID=$!
          trap 'kill $SRV_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            [ -f "${TMPDIR:-/tmp}/com.tt.calendar.mobile-server-addr" ] && break
            sleep 0.5
          done
          PROJ=$(find src-tauri/gen/apple -maxdepth 1 -name '*.xcodeproj' | head -1)
          [ -n "$PROJ" ] || { echo "找不到 .xcodeproj"; exit 1; }
          SCHEME=$(xcodebuild -project "$PROJ" -list | awk '/Schemes:/{f=1;next} f&&/iOS/{print;exit}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          [ -n "$SCHEME" ] || { echo "找不到 iOS scheme"; exit 1; }
          echo "project=$PROJ scheme=$SCHEME"
          xcodebuild archive \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/TTCalendar.xcarchive" \
            CI=true \
            npm_config_confirm_modules_purge=false \
            npm_config_verify_deps_before_run=false \
            > /tmp/xcb-archive.log 2>&1 || { tail -120 /tmp/xcb-archive.log; exit 1; }
          echo "归档完成"; ls "$GITHUB_WORKSPACE/TTCalendar.xcarchive/Products/Applications"

      - name: 导出签名 .ipa（手动签名，用自建描述文件）
        # 关键的「绕开云签」一步：provisioningProfiles 映射显式指定两个 target 的
        # App Store 描述文件，xcodebuild 便不再尝试云签创建（那一步没有权限）。
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>8RRWT62P25</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tt.calendar.mobile</key>
              <string>TT Calendar AppStore</string>
              <key>com.tt.calendar.mobile.widget</key>
              <string>TT Widget AppStore</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/TTCalendar.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/export" \
            -exportOptionsPlist ExportOptions.plist \
            > /tmp/xcb-export.log 2>&1 || { tail -120 /tmp/xcb-export.log; exit 1; }
          ls -lh "$GITHUB_WORKSPACE/build/export"

      - name: 上传 TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find "$GITHUB_WORKSPACE/build/export" -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "未找到 .ipa"; exit 1; }
          # 硬门槛：小组件必须真的嵌进 ipa（同 device-unsigned 的守门）
          unzip -l "$IPA" | grep -q "PlugIns/TTWidget.appex" || {
            echo "错误：ipa 内 PlugIns/TTWidget.appex 缺失——小组件未嵌入"; unzip -l "$IPA" | head -30; exit 1
          }
          # altool 从 ./private_keys 或 ~/.appstoreconnect/private_keys 读取 .p8
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: 上传签名 ipa 产物（留档）
        uses: actions/upload-artifact@v4
        with:
          name: tt-calendar-appstore-ipa
          path: build/export/*.ipa
          retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# 为什么不用 `tauri ios build` 而用「tauri ios init + 直接 xcodebuild」？
# ─ tauri ios build 在 CI 无开发者账号时会卡 "requires a development team"；
#   且它的 "Build Rust Code" Xcode run-script phase 内部调 pnpm，pnpm 11 在非
#   交互终端想清理 node_modules 会中止(ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY)。
# ─ Xcode run-script phase 不继承 workflow 的自定义 env（只继承构建变量），
#   所以靠 env / ~/.npmrc 都救不了那个 phase 里的 pnpm；但 **xcodebuild 的
#   build setting 会作为环境变量注入 run-script phase**——故用
#   `CI=true npm_config_confirm_modules_purge=false ...` 作为 build setting 传入，
#   pnpm 看到 CI=true 即跳过清理确认。
# ─ 直接 xcodebuild + CODE_SIGNING_ALLOWED=NO 产出「未签名 .app」，再手动打成
#   Payload/*.app 的 .ipa，iLoader/SideStore/Sideloadly 在本机自签装机（7 天有效，重装续）。
#
# 关于 "Build Rust Code" phase 的 WebSocket 依赖（关键坑）：
#   tauri ios xcode-script（该 phase 调用的命令）在开头【无条件】连一个 dev-server
#   WebSocket 取 CliOptions（见 tauri-cli crates/tauri-cli/src/mobile/mod.rs 的
#   read_options）：读 $TMPDIR/com.<id>-server-addr → ws://<内容> → 调 `options`。
#   没有任何 env / flag 能跳过它；文件缺失或连不上都 panic。CI 没有真实 dev server，
#   所以本 workflow 在 xcodebuild 前用 scripts/ci-ios-options-server（同版本 jsonrpsee）
#   起一个只实现 `options` 方法的假服务，把地址写进那个文件，让 xcode-script 正常
#   走完 Rust 编译（头文件 / lib 输出路径都由它正确生成）。构建完 trap EXIT 杀掉。
# ─────────────────────────────────────────────────────────────────────────────
