<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- TT Calendar Neo 应用图标（20260917 任务书 1.3）
       主题：日历卡 + 点点 + 完成对勾 —— 产品三大核心概念同框。
       iOS 会自动裁圆角，源图必须满幅方形。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="0.55" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景：品牌玫瑰渐变 + 左上柔光 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 装订环：日历卡顶部的两枚穿钉 -->
  <rect x="352" y="196" width="46" height="150" rx="23" fill="#FFE4E6"/>
  <rect x="626" y="196" width="46" height="150" rx="23" fill="#FFE4E6"/>

  <!-- 日历卡 -->
  <rect x="212" y="286" width="600" height="540" rx="76" fill="#FFFFFF"/>

  <!-- 点点行：三枚渐深色点（产品「点点」概念的视觉锚） -->
  <circle cx="392" cy="404" r="24" fill="#FDA4AF"/>
  <circle cx="512" cy="404" r="24" fill="#FB7185"/>
  <circle cx="632" cy="404" r="24" fill="#F43F5E"/>

  <!-- 完成对勾 -->
  <path d="M 368 585 L 474 690 L 668 478"
        fill="none" stroke="#F43F5E" stroke-width="70"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
