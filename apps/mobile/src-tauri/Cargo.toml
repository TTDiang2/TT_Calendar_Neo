[package]
name = "tt-calendar-mobile"
version = "0.1.0"
description = "TT Calendar mobile (Tauri 2 + Android/iOS)"
edition = "2021"
rust-version = "1.77"

# lib + binary 模式，mobile 友好（iOS/Android 直接复用 lib）
[lib]
name = "tt_calendar_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 关键：cfg(dev) 由是否带 custom-protocol feature 决定（见 tauri/build.rs 的
# `let dev = !custom_protocol`），与 cargo profile 无关。没有它，任何 cargo
# 构建（含 CI 里 xcodebuild 的「Build Rust Code」phase）都会把 App 编成 dev
# 模式：运行时代理到 devUrl（http://localhost:5175），真机上直接报
# "did you grant local network permissions"。放进 default，让任何构建默认
# 即生产模式；`tauri ios dev` / `tauri dev` 会自动 --no-default-features
# 排除它（tauri-cli/src/interface/rust.rs），无需手动干预。
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
