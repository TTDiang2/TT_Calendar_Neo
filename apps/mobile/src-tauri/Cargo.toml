[package]
name = "tt-calendar-mobile"
version = "0.1.0"
description = "TT Calendar mobile (Tauri 2 + Android/iOS)"
edition = "2021"
rust-version = "1.77"

# lib + binary 模式，mobile 友好（iOS/Android 直接复用 lib）
[lib]
name = "tt_calendar_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
