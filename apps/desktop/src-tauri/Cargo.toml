[package]
name = "tt-calendar-desktop"
version = "0.1.0"
description = "TT Calendar desktop (Tauri 2 + Windows)"
edition = "2021"
rust-version = "1.77"

# lib + binary 模式，mobile 友好（未来 iOS/Android 直接复用 lib）
[lib]
name = "tt_calendar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
